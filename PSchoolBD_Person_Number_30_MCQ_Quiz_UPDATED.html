<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>P School BD — Person & Number Quiz</title>
<style>header{position:sticky;top:0;z-index:100}
*{box-sizing:border-box}body{margin:0;background:#eef3ff;color:#172033;font-family:Arial,"Noto Sans Bengali",sans-serif}.wrap{max-width:760px;margin:auto;padding:10px}
header,.hero{background:linear-gradient(135deg,#123b8f,#692bb0);color:#fff;border-radius:20px;padding:18px;box-shadow:0 6px 20px #0002}h1{font-size:24px;margin:8px 0 14px}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}#timer{background:#fff;color:#173a8e;border-radius:30px;padding:8px 14px;font-weight:bold}#timer.warn{background:#d71920;color:#fff}
.card,.review{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #23448b18}.q{font-weight:bold;line-height:1.6;margin-bottom:10px}
button.opt{width:100%;text-align:left;padding:12px;margin:6px 0;border:2px solid #e0e5ef;border-radius:12px;background:#f9fbff;font-size:15px}button.opt.sel{background:#eee9ff;border-color:#6139b5}.letter{font-weight:bold;color:#5733a8;margin-right:8px}
.submit,.restart{width:100%;border:0;border-radius:13px;padding:15px;background:#173f96;color:white;font-size:17px;font-weight:bold;cursor:pointer}
#result{display:none}.hero{text-align:center}.score{font-size:45px;font-weight:900}.review{border:3px solid}.correct{border-color:#1b9a58;background:#effcf4}.wrong{border-color:#d52c35;background:#fff1f2}.unanswered{border-color:#e0ad12;background:#fff9df}.green{color:#087c3e;font-weight:bold}.red{color:#c51d28;font-weight:bold}
.popupbg{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:center;justify-content:center;padding:18px}.popup{background:white;border-radius:18px;padding:22px;max-width:430px;text-align:center}.popup button{border:0;border-radius:10px;padding:11px 20px;background:#173f96;color:white;font-weight:bold}
@media(max-width:500px){h1{font-size:20px}.card{padding:13px}button.opt{font-size:14px}}
.submitArea{padding:18px 0 40px}.submitArea .submit{display:block;max-width:736px;margin:0 auto;width:100%}</style></head>
<body><div class="wrap">
<section id="quizPage"><header><b>📚 PSCHOOLBD</b><h1>🎯 Person ও Number — ৩০টি MCQ</h1><div class="top"><span id="prog">উত্তর দেওয়া হয়েছে: 0 / 30</span><b id="timer">⏱️ 05:00</b></div></header><main id="quiz"></main><div class="submitArea"><button class="submit" onclick="submitQuiz()">✅ SUBMIT & SEE RESULT</button></div></section>
<section id="result"><div class="hero"><h2>🏆 QUIZ RESULT</h2><div class="score" id="score"></div><h3 id="msg"></h3></div><h2>📊 Answer Review</h2><div id="review"></div><button class="restart" onclick="restart()">🔄 আবার পরীক্ষা দিন</button></section>
</div><div class="popupbg" id="pop"><div class="popup"><h2>⚠️ কিছু প্রশ্নের উত্তর বাকি আছে!</h2><p id="poptext"></p><button onclick="closePop()">ঠিক আছে</button></div></div>
<script>
const qs=[{"q": "ইংরেজিতে Person কত প্রকার?", "o": ["২ প্রকার", "৩ প্রকার", "৪ প্রকার", "৫ প্রকার"], "a": 1}, {"q": "“I” কোন Person?", "o": ["1st Person", "2nd Person", "3rd Person", "None"], "a": 0}, {"q": "“We” কোনটি?", "o": ["1st Person Singular", "1st Person Plural", "2nd Person Plural", "3rd Person Plural"], "a": 1}, {"q": "“You” কোন Person?", "o": ["1st Person", "2nd Person", "3rd Person", "None"], "a": 1}, {"q": "“He” কোন Person ও Number?", "o": ["1st Person Singular", "2nd Person Singular", "3rd Person Singular", "3rd Person Plural"], "a": 2}, {"q": "“They” কোনটি?", "o": ["1st Person Plural", "2nd Person Plural", "3rd Person Singular", "3rd Person Plural"], "a": 3}, {"q": "“Rahim” কোন Person?", "o": ["1st Person", "2nd Person", "3rd Person", "None"], "a": 2}, {"q": "“She” কোন Person?", "o": ["First Person", "Second Person", "Third Person", "None"], "a": 2}, {"q": "Number কত প্রকার?", "o": ["১ প্রকার", "২ প্রকার", "৩ প্রকার", "৪ প্রকার"], "a": 1}, {"q": "একজন ব্যক্তি বা একটি বস্তু বোঝালে তাকে কী বলে?", "o": ["Plural Number", "Singular Number", "Second Person", "Third Person"], "a": 1}, {"q": "একাধিক ব্যক্তি বা বস্তু বোঝালে তাকে কী বলে?", "o": ["Singular Number", "Plural Number", "First Person", "Second Person"], "a": 1}, {"q": "“Boy” কোন Number?", "o": ["Singular", "Plural", "Both", "None"], "a": 0}, {"q": "“Boys” কোন Number?", "o": ["Singular", "Plural", "First Person", "Second Person"], "a": 1}, {"q": "“I play football.” বাক্যে Subject কোনটি?", "o": ["play", "football", "I", "the"], "a": 2}, {"q": "“He plays football.” বাক্যে “He” কোন Person?", "o": ["1st Person", "2nd Person", "3rd Person", "None"], "a": 2}, {"q": "Present Indefinite Tense-এ 3rd Person Singular Subject হলে সাধারণত Verb-এর শেষে কী যুক্ত হয়?", "o": ["ed", "ing", "s/es", "en"], "a": 2}, {"q": "কোন বাক্যটি সঠিক?", "o": ["He play football.", "He plays football.", "He playing football.", "He played football."], "a": 1}, {"q": "কোন বাক্যটি সঠিক?", "o": ["She read a book.", "She reads a book.", "She reading a book.", "She readed a book."], "a": 1}, {"q": "“They play football.” বাক্যে “play”-এর শেষে s নেই কেন?", "o": ["They 1st Person Singular", "They 2nd Person", "They 3rd Person Plural", "They 3rd Person Singular"], "a": 2}, {"q": "“Rahim goes to school.” বাক্যে “goes” ব্যবহারের কারণ কী?", "o": ["Rahim 1st Person", "Rahim 2nd Person", "Rahim 3rd Person Singular", "Rahim 3rd Person Plural"], "a": 2}, {"q": "“We are students.” বাক্যে “We” কোন Person ও Number?", "o": ["1st Person Singular", "1st Person Plural", "2nd Person Plural", "3rd Person Plural"], "a": 1}, {"q": "“You are a good boy.” বাক্যে “You” কোন Person?", "o": ["1st Person", "2nd Person", "3rd Person", "None"], "a": 1}, {"q": "“Afsana reads a book.” বাক্যে Afsana কোন Person?", "o": ["1st Person", "2nd Person", "3rd Person", "None"], "a": 2}, {"q": "কোনটি 3rd Person Singular?", "o": ["I", "We", "They", "She"], "a": 3}, {"q": "কোনটি 3rd Person Plural?", "o": ["He", "She", "They", "It"], "a": 2}, {"q": "“Girls” কোন Number?", "o": ["Singular", "Plural", "First Person", "Second Person"], "a": 1}, {"q": "“Book” শব্দটির Plural কী?", "o": ["Bookes", "Books", "Bookies", "Book"], "a": 1}, {"q": "“My mother cooks rice.” বাক্যে “My mother” কোন Person?", "o": ["1st Person", "2nd Person", "3rd Person Singular", "3rd Person Plural"], "a": 2}, {"q": "কোন বাক্যটি সঠিক?", "o": ["Rahim go to school.", "Rahim goes to school.", "Rahim going to school.", "Rahim gone to school."], "a": 1}, {"q": "“We play football.” বাক্যে Verb কোনটি?", "o": ["We", "play", "football", "We play"], "a": 1}];let ans=Array(qs.length).fill(null),left=300,tid;
const esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function render(){quiz.innerHTML="";qs.forEach((x,i)=>{let c=document.createElement("div");c.className="card";c.innerHTML='<div class="q">প্রশ্ন '+(i+1)+'. '+esc(x.q)+'</div>';x.o.forEach((v,j)=>{let b=document.createElement("button");b.className="opt"+(ans[i]===j?" sel":"");b.innerHTML='<span class="letter">'+String.fromCharCode(65+j)+')</span>'+esc(v);b.onclick=()=>{ans[i]=j;render()};c.appendChild(b)});quiz.appendChild(c)});prog.textContent="উত্তর দেওয়া হয়েছে: "+ans.filter(x=>x!==null).length+" / "+qs.length}
function clock(){let m=String(Math.floor(left/60)).padStart(2,"0"),s=String(left%60).padStart(2,"0");timer.textContent="⏱️ "+m+":"+s;timer.classList.toggle("warn",left<=60)}
function start(){clearInterval(tid);left=300;clock();tid=setInterval(()=>{left--;clock();if(left<=0){clearInterval(tid);finish()}},1000)}
function submitQuiz(){let u=ans.map((v,i)=>v===null?i+1:null).filter(Boolean);if(u.length){poptext.textContent="প্রশ্ন "+u.join(", ")+"-এর উত্তর দেওয়া হয়নি। সব প্রশ্নের উত্তর দিয়ে আবার Submit করুন।";pop.style.display="flex"}else finish()}
function closePop(){pop.style.display="none"}
function finish(){clearInterval(tid);let sc=ans.reduce((n,v,i)=>n+(v===qs[i].a?1:0),0);score.textContent=sc+" / "+qs.length;msg.textContent=sc===30?"🌟 অসাধারণ!":sc>=16?"👏 খুব ভালো!":sc>=10?"👍 ভালো চেষ্টা!":"💪 আরও চেষ্টা করো, তুমি পারবে!";review.innerHTML="";qs.forEach((x,i)=>{let r=document.createElement("div"),ok=ans[i]===x.a,un=ans[i]===null;r.className="review "+(un?"unanswered":ok?"correct":"wrong");let h='<div class="q">প্রশ্ন '+(i+1)+'. '+esc(x.q)+'</div>';if(un)h+="<p>⚠️ উত্তর দেওয়া হয়নি</p>";else h+='<p class="'+(ok?"green":"red")+'">'+(ok?"✅":"❌")+" আপনার উত্তর: "+String.fromCharCode(65+ans[i])+") "+esc(x.o[ans[i]])+"</p>";h+='<p class="green">✅ সঠিক উত্তর: '+String.fromCharCode(65+x.a)+") "+esc(x.o[x.a])+"</p>";r.innerHTML=h;review.appendChild(r)});quizPage.style.display="none";result.style.display="block";scrollTo(0,0)}
function restart(){ans=Array(qs.length).fill(null);result.style.display="none";quizPage.style.display="block";render();start();scrollTo(0,0)}
render();start();
</script></body></html>
